<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase Sector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div>
      <p class="eyebrow">Independent sounds • bootlegs • underground drops</p>

      <h1>Phase Sector</h1>

      <p class="tagline">
        A private sector for underground tracks, edits, remixes, and unreleased sounds.
      </p>
    </div>
  </header>

  <main>
    <section class="section-header">
      <h2>Latest Drops</h2>
      <p>Stream, like, and share tracks from Phase Sector.</p>
    </section>

    <section id="song-list" class="song-grid"></section>
  </main>

  <footer>
    <p>© Phase Sector — independent music platform</p>
  </footer>

  <div id="mini-player" class="mini-player hidden">
    <img id="mini-cover" src="" alt="Now playing cover" />

    <div class="mini-info">
      <p id="mini-title">Not playing</p>
      <span id="mini-artist">Kosmic Noize</span>

      <div id="mini-progress" class="mini-progress">
        <div id="mini-progress-bar" class="mini-progress-bar"></div>
      </div>
    </div>

    <button id="shuffle-btn" class="mini-control-btn">🔀</button>
    <button id="mini-play-btn" class="mini-play-btn">▶</button>
    <button id="loop-btn" class="mini-control-btn">🔁</button>

    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input id="volume-slider" type="range" min="0" max="100" value="100" />
    </div>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>

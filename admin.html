<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase Sector Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div>
      <img
        src="assets/phase-sector-logo.png"
        alt="Phase Sector"
        class="hero-logo"
      />

      <h1 class="hidden-title">Phase Sector Admin</h1>
      <p class="tagline">Private upload control panel.</p>
    </div>
  </header>

  <main>
    <a class="back-link" href="index.html">← Back to Latest Drops</a>

    <section class="section-header">
      <h2>Admin Upload</h2>
      <p>Add track metadata after you manually upload the MP3 and artwork to GitHub.</p>
    </section>

    <section id="admin-login" class="admin-card">
      <h3>Owner Login</h3>
      <p class="description">Enter your admin password to unlock the upload form.</p>

      <input id="admin-password" type="password" placeholder="Admin password" />
      <button id="login-btn">Unlock Admin</button>
    </section>

    <section id="admin-panel" class="admin-card hidden-admin">
      <h3>Add New Track</h3>

      <div class="admin-grid">
        <label>
          Song Title
          <input id="song-title" type="text" placeholder="ARC" />
        </label>

        <label>
          Artist Name
          <input id="artist-name-input" type="text" placeholder="Kosmic Noize" />
        </label>

        <label>
          MP3 Path
          <input id="song-file" type="text" placeholder="songs/track-name.mp3" />
        </label>

        <label>
          Cover Path
          <input id="song-cover" type="text" placeholder="covers/artwork.jpg" />
        </label>

        <label>
          Posted Date
          <input id="song-posted" type="date" />
        </label>

        <label>
          Description
          <textarea id="song-description" placeholder="Track description..."></textarea>
        </label>
      </div>

      <h3>Artist Social Links</h3>

      <div class="admin-grid">
        <label>
          SoundCloud
          <input id="artist-soundcloud" type="url" placeholder="https://soundcloud.com/artist" />
        </label>

        <label>
          Spotify
          <input id="artist-spotify" type="url" placeholder="https://open.spotify.com/artist/..." />
        </label>

        <label>
          Apple Music
          <input id="artist-applemusic" type="url" placeholder="https://music.apple.com/..." />
        </label>

        <label>
          YouTube
          <input id="artist-youtube" type="url" placeholder="https://youtube.com/@artist" />
        </label>
      </div>

      <button id="add-track-btn">Add Track</button>
      <p id="admin-status" class="description"></p>
    </section>
  </main>

  <footer>
    <p>© Phase Sector — admin</p>
  </footer>

  <script type="module" src="admin.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kosmic Kloud</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div>
      <p class="eyebrow">Independent sounds • bootlegs • underground drops</p>
      <h1>Kosmic Kloud</h1>
      <p class="tagline">A private cloud for tracks, remixes, edits, and sounds from the crew.</p>
    </div>
  </header>

  <main>
    <section class="section-header">
      <h2>Latest Drops</h2>
      <p>Stream, like, and share tracks from Kosmic Kloud.</p>
    </section>

    <section id="song-list" class="song-grid"></section>
  </main>

  <footer>
    <p>© Kosmic Kloud — independent music platform</p>
  </footer>

  <div id="mini-player" class="mini-player hidden">
    <img id="mini-cover" src="" alt="Now playing cover" />

    <div class="mini-info">
      <p id="mini-title">Not playing</p>
      <span id="mini-artist">Kosmic Noize</span>

      <div class="mini-progress" id="mini-progress">
        <div class="mini-progress-bar" id="mini-progress-bar"></div>
      </div>
    </div>

    <button id="mini-play-btn" class="mini-play-btn">▶</button>
  </div>

  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kosmic Kloud</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <span class="eyebrow">Independent sounds • bootlegs • underground drops</span>
    <h1>Kosmic Kloud</h1>
    <p class="tagline">A private cloud for tracks, remixes, edits, and sounds from the crew.</p>
  </header>

  <main>
    <section class="section-header">
      <h2>Tracks</h2>
      <p>Stream the latest drops.</p>
    </section>

    <section id="song-grid" class="song-grid"></section>
  </main>

  <footer>
    Kosmic Kloud © 2026
  </footer>

  <div id="mini-player" class="hidden">
    <img id="mini-cover" src="" alt="Cover" />

    <div class="mini-info">
      <p id="mini-title">Track Title</p>
      <span id="mini-artist">Artist</span>

      <div id="mini-progress">
        <div id="mini-progress-bar"></div>
      </div>
    </div>

    <button id="shuffle-btn" class="mini-control-btn">🔀</button>
    <button id="mini-play-btn">▶</button>
    <button id="loop-btn" class="mini-control-btn">🔁</button>

    <div class="volume-wrap">
      <span class="volume-icon">🔊</span>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" />
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
